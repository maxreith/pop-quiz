<meta charset="utf-8">
<title>Pop Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one exam form on a margin-ruled paper sheet; the score tally sits in the header. */
:root { --bg: #ecebe4; --f-paper: "Libre Baskerville", Georgia, serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1a18; } }
:root[data-theme="dark"] { --bg: #1a1a18; }
body { background: var(--bg); margin: 0;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid #2f6fdb; outline-offset: 2px; }
button:disabled { cursor: default; }
ol { list-style: none; margin: 0; padding: 0; }

.pp { max-width: 780px; margin: 0 auto; box-sizing: border-box; border-radius: 6px; background: #fbfaf5; color: #1f1f1f;
  padding: 26px clamp(16px, 4vw, 40px) 30px clamp(44px, 8vw, 80px); position: relative; font-family: var(--f-paper); }
.pp::before { content: ""; position: absolute; top: 0; bottom: 0; left: clamp(32px, 6vw, 60px); border-left: 2px solid #e8a3a3; }
.pp .hd { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; border-bottom: 1.5px solid #1f1f1f; padding-bottom: 10px; margin-bottom: 20px; }
.pp .hd b { font-size: 17px; display: block; }
.pp .hd small { font-size: 12px; color: #555; display: block; }
.pp .tally { display: flex; gap: 5px; align-items: center; }
.pp .tally i { width: 18px; height: 18px; border: 1.5px dashed #b9b4a5; border-radius: 3px; display: block; transition: background .2s, border-color .2s; }
.pp .tally i.on { background: #1d6b45; border: 1.5px solid #1d6b45; }
.pp .tally i.off { background: #c0261d33; border: 1.5px solid #c0261d88; }
.pp .tally span { font: 13px var(--f-mono); margin-left: 6px; color: #555; min-width: 4ch; }
.pp ol { display: grid; gap: 24px; }
.pp li { display: grid; gap: 8px; }
.pp .pt { font-size: 12px; font-style: italic; color: #555; }
.pp .st { margin: 0; font-size: 15px; line-height: 1.65; }
.pp code { font: 12.5px var(--f-mono); overflow-wrap: anywhere; }
.pp .boxes { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.pp .bx { background: none; border: none; padding: 2px 0; display: inline-flex; align-items: center; gap: 8px; font: 14px var(--f-paper); color: inherit; transition: color .2s; }
.pp .bx i { width: 18px; height: 18px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; transition: background .2s, border-color .2s; }
.pp .bx i svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pp .bx.right { color: #1d6b45; }
.pp .bx.right i { background: #e1f0e6; border-color: #1d6b45; }
.pp .bx.wrong { color: #c0261d; }
.pp .bx.wrong i { background: #fbe7e5; border-color: #c0261d; }
.pp .sl { background: none; border: none; padding: 0; font: 13px var(--f-paper); color: #c0261d; text-decoration: underline; margin-left: auto; }
.pp .sol { display: grid; gap: 6px; max-width: 64ch; }
.pp .sol[hidden] { display: none; }
.pp .note { font: 14px/1.6 var(--f-paper); color: #8a2a24; margin: 0; }
.pp .refs { margin: 0; padding: 0 0 0 10px; list-style: none; display: grid; gap: 1px; border-left: 1.5px solid #e8a3a3; }
.pp .refs li { font: 12px var(--f-mono); color: #8a3a34; overflow-wrap: anywhere; }
.pp .foot { margin-top: 22px; display: flex; gap: 12px; }
.pp .foot button { background: none; border: 1px solid #999; padding: 3px 12px; font: 13px var(--f-paper); color: #333; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

<main id="exam"></main>

<script>
/* ===== EXAM DATA: the agent replaces only this object ===== */
const EXAM = {
  repo: "example/http-client",
  ref: "feature/retries · a1b2c3d..e4f5a6b",
  title: "Retry failed requests with backoff",
  questions: [
    { answer: false,
      statement: "The new `retry` option retries every failed request up to `max_attempts` times, including `POST` requests that timed out.",
      explain: "Retries apply only to idempotent methods. `should_retry` returns early for `POST` and `PATCH`, so a timed-out `POST` fails on the first attempt.",
      refs: ["client/retry.py:42-48"] },
    { answer: true,
      statement: "A client built without a `retry` argument behaves exactly as before: it sends each request once.",
      explain: "`Client.__init__` defaults `retry` to `None`, and `send` only enters the retry loop when it is set. Existing callers keep single-attempt behavior.",
      refs: ["client/client.py:31", "client/client.py:88-92"] },
    { answer: false,
      statement: "With `max_attempts=3` and `backoff=0.5`, the client waits 0.5 s before the second attempt and 1.0 s before the third, so a failing request gives up after 1.5 s of waiting.",
      explain: "The delay is `backoff * 2 ** attempt` with `attempt` starting at 1, so the waits are 1.0 s and 2.0 s. The total wait is 3.0 s, not 1.5 s.",
      refs: ["client/retry.py:61", "tests/test_retry.py:20-27"] }
  ]
};
/* ===== END EXAM DATA ===== */

const Q = EXAM.questions;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const pop = el => { if (!RM.matches && el.animate) el.animate([{ transform: "scale(1)" }, { transform: "scale(1.4)" }, { transform: "scale(1)" }], { duration: 400, easing: "cubic-bezier(.2,1.6,.4,1)" }); };
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4"/></svg>';
const CROSS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5"/></svg>';
document.title = `Pop Quiz · ${EXAM.title}`;

function build() {
  const root = document.getElementById("exam");
  const box = h(`<div class="pp"><div class="hd"><div><b>${esc(EXAM.title)}</b><small>${esc(EXAM.repo)} · ${esc(EXAM.ref)} · ${Q.length} problems</small></div>
    <div class="tally" aria-label="Score tally">${Q.map(() => "<i></i>").join("")}<span>0/${Q.length}</span></div></div>
    <ol></ol><div class="foot"><button data-reset>new attempt</button><button data-all>all solutions</button></div></div>`);
  const list = box.querySelector("ol");
  let score = 0;
  Q.forEach((q, i) => {
    const li = h(`<li><span class="pt">Problem ${i + 1}</span><p class="st">${fmt(q.statement)}</p>
      <div class="boxes"><button class="bx" data-v="1"><i></i>true</button><button class="bx" data-v="0"><i></i>false</button><button class="sl" data-sol>solution</button></div>
      <div class="sol" hidden><p class="note">${q.answer ? "True" : "False"}. ${fmt(q.explain)}</p>
      <ul class="refs">${q.refs.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div></li>`);
    li.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const ok = (b.dataset.v === "1") === q.answer;
      li.querySelectorAll("[data-v]").forEach(x => x.disabled = true);
      b.classList.add(ok ? "right" : "wrong");
      b.querySelector("i").innerHTML = ok ? CHECK : CROSS;
      const t = box.querySelectorAll(".tally i")[i];
      t.classList.add(ok ? "on" : "off");
      if (ok) { score++; pop(t); }
      box.querySelector(".tally span").textContent = `${score}/${Q.length}`;
    });
    const sb = li.querySelector("[data-sol]");
    sb.onclick = () => { const s = li.querySelector(".sol"); s.hidden = !s.hidden; sb.textContent = s.hidden ? "solution" : "hide solution"; };
    list.appendChild(li);
  });
  box.querySelector("[data-reset]").onclick = build;
  box.querySelector("[data-all]").onclick = () => box.querySelectorAll(".sol").forEach(s => s.hidden = false);
  root.replaceChildren(box);
}
build();
</script>
